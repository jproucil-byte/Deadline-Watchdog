name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Python ${{ matrix.python }} (Linux)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests (standard library only)
        run: python -m unittest discover -s tests -v

  with-extras:
    name: With Tesseract, poppler and a browser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install optional Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow reportlab pypdf playwright
          python -m playwright install --with-deps chromium
      - name: Run the tests (OCR, PDF and browser tests included)
        run: python -m unittest discover -s tests -v

  other-systems:
    name: ${{ matrix.os }} (best effort)
    runs-on: ${{ matrix.os }}
    continue-on-error: true       # the Windows and macOS launchers were written without being able to test them
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
